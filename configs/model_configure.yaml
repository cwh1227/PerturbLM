model:
  ATTN:
    # ===== 基础 Transformer 参数 =====
    hidden_size: 256
    n_heads: 8
    attention_probs_dropout_prob: 0.1
    hidden_dropout_prob: 0.1

    # ===== token 数（决定 (B, M)）=====
    topk_cell: 128
    topk_drug: 32

    # ===== Double Transformer 结构 =====
    ctl_structure: SA+SA+SA+SA
    trt_structure: CA+SA+SA+CA

    # ===== 预留（后期用）=====
    sparse_flag: False
    cell_input_hidden_dropout_prob: 0.1
    drug_input_hidden_dropout_prob: 0.1



dataset:
  gene_num: 978
  n_bins: 128
  atom_num: 24
  max_atom_size: 122
  max_value: 15.993
  min_value: 1.854

l1000:
  num_pert_dose: 10
  num_pert_time: 3
  num_cell_id: 240
  num_tissue_id: 21
panacea:
  num_pert_dose: 10
  num_pert_time: 3  
  num_cell_id: 240
  num_tissue_id: 21
